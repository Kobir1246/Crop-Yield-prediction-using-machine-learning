<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="title">Contact — Crop Production Prediction System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root { --bg: #f5f7f5; --card-bg: #fff; --text: #333; --text-muted: #555; --border: #e0e0e0; --nav-shadow: rgba(0,0,0,0.05); --heading: #1b5e20; }
[data-theme="dark"] { --bg: #121212; --card-bg: #1e1e1e; --text: #e0e0e0; --text-muted: #aaa; --border: #333; --nav-shadow: rgba(0,0,0,0.3); --heading: #81c784; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; transition: background 0.3s, color 0.3s; }
.navbar-custom { background: var(--card-bg) !important; box-shadow: 0 1px 6px var(--nav-shadow); padding: 12px 0; }
.navbar-custom .navbar-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; color: #1b5e20 !important; letter-spacing: -0.01em; }
[data-theme="dark"] .navbar-custom .navbar-brand { color: #81c784 !important; }
.navbar-custom .brand-logo { width: 38px; height: 38px; border-radius: 50%; background: linear-gradient(135deg, #1b5e20, #388e3c); display: flex; align-items: center; justify-content: center; color: #fff; font-size: 1.2rem; }
.nav-link { font-weight: 500; color: #444 !important; padding: 6px 16px !important; font-size: 0.92rem; position: relative; }
.nav-link:hover { color: #1b5e20 !important; }
.nav-link.active { color: #1b5e20 !important; }
.nav-link.active::after { content: ''; position: absolute; bottom: 0; left: 16px; right: 16px; height: 2px; background: #1b5e20; border-radius: 1px; }
[data-theme="dark"] .nav-link { color: #bbb !important; }
[data-theme="dark"] .nav-link:hover, [data-theme="dark"] .nav-link.active { color: #81c784 !important; }
[data-theme="dark"] .nav-link.active::after { background: #81c784; }
.nav-icon-btn { background: none; border: none; color: #555; font-size: 1.2rem; padding: 6px 10px; cursor: pointer; border-radius: 6px; transition: background 0.2s; line-height: 1; }
.nav-icon-btn:hover { background: #e8f5e9; color: #1b5e20; }
[data-theme="dark"] .nav-icon-btn { color: #bbb; }
[data-theme="dark"] .nav-icon-btn:hover { background: #1a2e1a; color: #81c784; }
.btn-get-started { background: #1b5e20; color: #fff !important; border: none; padding: 8px 22px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 2px 8px rgba(27,94,32,0.2); transition: background 0.2s; text-decoration: none; }
.btn-get-started:hover { background: #0d3b0f; color: #fff !important; }
.container-main { max-width: 600px; margin: 40px auto; padding: 0 24px; flex: 1; }
.card-custom { background: var(--card-bg); border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 36px; border: none; }
h1 { font-size: 1.8rem; font-weight: 800; color: var(--heading); margin-bottom: 20px; }
p { font-size: 0.95rem; line-height: 1.8; color: var(--text-muted); margin-bottom: 16px; }
.contact-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
.contact-item:last-child { border-bottom: none; }
.contact-item strong { display: block; font-size: 0.8rem; color: #999; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.contact-item span { font-size: 0.95rem; color: var(--text); }
[data-theme="dark"] .text-muted { color: #aaa !important; }
[data-theme="dark"] hr { border-color: #333; }
</style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom">
  <div class="container">
    <a class="navbar-brand" href="/">
      <span class="brand-logo">&#127793;</span>
      <span data-i18n="brand">Crop Production Prediction System</span>
    </a>
    <div class="d-flex align-items-center gap-1 order-lg-last ms-auto ms-lg-0">
      <button class="nav-icon-btn" id="langToggleBtn" title="বাংলা">&#127760;</button>
      <button class="nav-icon-btn" id="themeToggleBtn" title="Toggle theme">&#9789;</button>
      <button class="navbar-toggler ms-1" type="button" data-bs-toggle="collapse" data-bs-target="#navMain">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="collapse navbar-collapse" id="navMain">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="/" data-i18n="home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="/prediction" data-i18n="prediction">Prediction</a></li>
        <li class="nav-item"><a class="nav-link" href="/about" data-i18n="about">About</a></li>
        <li class="nav-item"><a class="nav-link active" href="/contact" data-i18n="contact">Contact</a></li>
      </ul>
      <a class="btn-get-started" href="/prediction">&#8594; Get Started</a>
    </div>
  </div>
</nav>

<div class="container-main">
  <div class="card-custom">
    <h1 data-i18n="contact_heading">Contact</h1>
    <p data-i18n="contact_desc">For questions, suggestions, or collaboration inquiries, please reach out:</p>
    <div class="contact-item"><strong data-i18n="contact_dev_label">Developers</strong><span data-i18n="contact_devs">Sabbir, Jarif</span></div>
    <div class="contact-item"><strong data-i18n="contact_email_label">Email</strong><span data-i18n="contact_email">sabbir@email.com</span></div>
    <div class="contact-item"><strong data-i18n="contact_inst_label">Institution</strong><span data-i18n="contact_institution">Daffodil International University</span></div>
    <a href="/prediction" class="btn-get-started d-inline-flex mt-3">&#8594; Start Prediction</a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
(function() {
  var theme = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", theme);
  var themeBtn = document.getElementById("themeToggleBtn");
  if (themeBtn) {
    themeBtn.innerHTML = theme === "dark" ? "\u{1F31E}" : "\u{1F319}";
    themeBtn.addEventListener("click", function() {
      var cur = document.documentElement.getAttribute("data-theme");
      var next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("theme", next);
      this.innerHTML = next === "dark" ? "\u{1F31E}" : "\u{1F319}";
    });
  }
  var lang = localStorage.getItem("lang") || "en";
  var langBtn = document.getElementById("langToggleBtn");
  var i18n = {
    en: { title: "Contact — Crop Production Prediction System", brand: "Crop Production Prediction System", home: "Home", prediction: "Prediction", about: "About", contact: "Contact", contact_heading: "Contact", contact_desc: "For questions, suggestions, or collaboration inquiries, please reach out:", contact_dev_label: "Developers", contact_devs: "Sabbir, Jarif", contact_email_label: "Email", contact_email: "sabbir@email.com", contact_inst_label: "Institution", contact_institution: "Daffodil International University" },
    bn: { title: "\u09AF\u09CB\u0997\u09BE\u09AF\u09CB\u0997 — \u09AB\u09B8\u09B2\u09C7\u09B0 \u09AB\u09B2\u09A8 \u09AA\u09C2\u09B0\u09CD\u09AC\u09BE\u09AD\u09BE\u09B8 \u09AA\u09A6\u09CD\u09A7\u09A4\u09BF", brand: "\u09AB\u09B2\u09A8 \u09AA\u09C2\u09B0\u09CD\u09AC\u09BE\u09AD\u09BE\u09B8 \u09AA\u09A6\u09CD\u09A7\u09A4\u09BF", home: "\u09B9\u09CB\u09AE", prediction: "\u09AA\u09C2\u09B0\u09CD\u09AC\u09BE\u09AD\u09BE\u09B8", about: "\u09B8\u09AE\u09CD\u09AA\u09B0\u09CD\u0995\u09C7", contact: "\u09AF\u09CB\u0997\u09BE\u09AF\u09CB\u0997", contact_heading: "\u09AF\u09CB\u0997\u09BE\u09AF\u09CB\u0997", contact_desc: "\u09AA\u09CD\u09B0\u09B6\u09CD\u09A8, \u09AA\u09B0\u09BE\u09AE\u09B0\u09CD\u09B6 \u09AC\u09BE \u09B8\u09B9\u09AF\u09CB\u0997\u09BF\u09A4\u09BE\u09B0 \u099C\u09A8\u09CD\u09AF \u0986\u09AE\u09BE\u09A6\u09C7\u09B0 \u09B8\u09BE\u09A5\u09C7 \u09AF\u09CB\u0997\u09BE\u09AF\u09CB\u0997 \u0995\u09B0\u09C1\u09A8:", contact_dev_label: "\u0989\u09A8\u09CD\u09A8\u09AF\u09BC\u09A8\u0995\u09BE\u09B0\u09C0", contact_devs: "\u09B8\u09BE\u09AC\u09CD\u09AC\u09BF\u09B0, \u099C\u09BE\u09B0\u09BF\u09AB", contact_email_label: "\u0987\u09AE\u09C7\u0987\u09B2", contact_email: "sabbir@email.com", contact_inst_label: "\u09AA\u09CD\u09B0\u09A4\u09BF\u09B7\u09CD\u09A0\u09BE\u09A8", contact_institution: "\u09A1\u09CD\u09AF\u09BE\u09AB\u09CB\u09A1\u09BF\u09B2 \u0987\u09A8\u09CD\u099F\u09BE\u09B0\u09A8\u09CD\u09AF\u09BE\u09B6\u09A8\u09BE\u09B2 \u0987\u0989\u09A8\u09BF\u09AD\u09BE\u09B0\u09CD\u09B8\u09BF\u099F\u09BF" }
  };
  function applyLang(l) {
    localStorage.setItem("lang", l);
    var t = i18n[l] || i18n.en;
    document.querySelectorAll("[data-i18n]").forEach(function(el) {
      var key = el.getAttribute("data-i18n");
      if (t[key] !== undefined) el.innerHTML = t[key];
    });
    if (langBtn) langBtn.title = l === "bn" ? "English" : "\u09AC\u09BE\u0982\u09B2\u09BE";
  }
  applyLang(lang);
  if (langBtn) langBtn.addEventListener("click", function() {
    applyLang(localStorage.getItem("lang") === "bn" ? "en" : "bn");
  });
})();
</script>
</body>
</html>
